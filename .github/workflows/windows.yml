name: Build Windows app
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run sync
      - run: npx electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mamba-mentality-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Mamba Mentality for Windows ${TAG#desktop-v}" --notes "Unsigned Windows build (installer, portable exe, zip). Windows SmartScreen may warn: click More info > Run anyway."
          gh release upload "$TAG" dist/*.exe dist/*.zip --clobber
